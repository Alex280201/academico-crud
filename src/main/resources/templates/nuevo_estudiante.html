<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="ISO-8859-1">
        <title>Ingreso Estudiantes</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    </head>

    <body>
        <div class="container">
            <h1>Ingreso de Estudiantes</h1>
            <hr>
            <h2>Datos del Estudiante</h2>

            <form action="#" th:action="@{/grabarEstudiante}" th:object="${estudiante}" method="POST">
                <input type="text" th:field="*{numCedula}" placeholder="Numero Cedula" class="form-control mb-4 col-4">
                <input type="text" th:field="*{nomEstudiante}" placeholder="Nombre Estudiante" class="form-control mb-4 col-4">
                <input type="text" th:field="*{email}" placeholder="e-mail" class="form-control mb-4 col-4">
                <input type="text" th:field="*{telefono}" placeholder="Numero Telefono" class="form-control mb-4 col-4">
                <input type="text" th:field="*{direccion}" placeholder="Direccion" class="form-control mb-4 col-4">
                <input type="text" th:field="*{fechNacimiento}" placeholder="Fecha Nacimiento" class="form-control mb-4 col-4">
                <button type="submit" class="btn btn-info col-2"> Grabar Datos</button>
            </form>

            <hr>

            <a th:href="@{/}"> Retornar Lista de Estudiantes</a>
        </div>
    </body>
</html>
