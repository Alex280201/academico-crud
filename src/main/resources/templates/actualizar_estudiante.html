<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="ISO-8859-1">
        <title>Gestion de Estudiantes</title>

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    </head>

    <body>
        <div class="container">
            <h1>Actualizar datos del Estudiante</h1>
            <hr>
            <h2>Datos del Estudiante</h2>
            
            <form action="#" th:action="@{/grabarEstudiante}" th:object="${estudiante}" method="POST">
                <input type="hidden" th:field="*{numMatricula}" />
                <input type="text" th:field="*{numCedula}"  class="form-control mb-4 col-4">
                <input type="text" th:field="*{nomEstudiante}"  class="form-control mb-4 col-4">
                <input type="text" th:field="*{email}"  class="form-control mb-4 col-4">
                <input type="text" th:field="*{telefono}" class="form-control mb-4 col-4">
                <input type="text" th:field="*{direccion}" class="form-control mb-4 col-4">
                <input type="text" th:field="*{fechNacimiento}" class="form-control mb-4 col-4">
                <button type="submit" class="btn btn-info col-2"> Actualizar Datos</button>
            </form> 
            <hr>
            <a th:href="@{/}"> Retornar Lista de Estudiantes</a>
        </div>
    </body>
</html>
