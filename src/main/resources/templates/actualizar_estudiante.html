<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualizar Estudiante · Academico</title>
  <link rel="stylesheet" href="../static/estilos.css" th:href="@{/estilos.css}">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <h1>Academico</h1>
      <p>Gestión académica</p>
      <nav aria-label="Menú principal">
        <a th:href="@{/pagina1.html}">Estudiantes (Tarjetas)</a>
        <a th:href="@{/pagina2.html}">Pokédex (API)</a>
        <a th:href="@{/listarEstudiantes}">Reporte Estudiantes</a>
        <a th:href="@{/mostrarFormNuevoEstudiante}">Nuevo Estudiante</a>
      </nav>
    </aside>

    <main class="contenido">
      <div class="barra">
        <button class="btn-menu" id="btnMenu" aria-label="Abrir menú">☰</button>
        <div class="titulo" style="margin:0;">
          <h2>Gestión de Estudiantes</h2>
        </div>
      </div>

      <div class="tarjeta-formulario">
        <div class="titulo" style="margin-bottom: .75rem;">
          <h2 style="font-size: 1.3rem;">Actualizar Datos del Estudiante</h2>
          <span class="tenue" th:text="'Matrícula #' + ${estudiante.numMatricula}">Matrícula #0</span>
        </div>

        <form action="#" th:action="@{/grabarEstudiante}" th:object="${estudiante}" method="POST">
          <input type="hidden" th:field="*{numMatricula}">

          <div class="campos">
            <label class="campo">
              Número de Cédula *
              <input type="text" th:field="*{numCedula}" placeholder="Número de Cédula" required autocomplete="off">
            </label>

            <label class="campo">
              Nombre Completo *
              <input type="text" th:field="*{nomEstudiante}" placeholder="Nombre del Estudiante" required autocomplete="off">
            </label>

            <label class="campo">
              Correo Electrónico
              <input type="email" th:field="*{email}" placeholder="Correo electrónico" autocomplete="off">
            </label>

            <label class="campo">
              Teléfono de Contacto
              <input type="tel" th:field="*{telefono}" placeholder="Número de Teléfono" autocomplete="off">
            </label>

            <label class="campo campo-completo">
              Dirección Domiciliaria
              <input type="text" th:field="*{direccion}" placeholder="Dirección" autocomplete="off">
            </label>

            <label class="campo campo-completo">
              Fecha de Nacimiento
              <input type="date" th:field="*{fechNacimiento}">
            </label>
          </div>

          <div class="acciones" style="margin-top: 1.5rem;">
            <button type="submit" class="principal">Guardar Cambios</button>
            <a th:href="@{/listarEstudiantes}" class="btn-accion cerrar">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    const btnMenu = document.getElementById("btnMenu");
    if (btnMenu) btnMenu.addEventListener("click", () => document.getElementById("sidebar").classList.toggle("abierto"));
  </script>
</body>
</html>
