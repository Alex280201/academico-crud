upstream academico_backend {
    least_conn;                    # Balanceo de carga por menor número de conexiones
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_tokens off;             # Oculta la versión de Nginx por seguridad

    location / {
        proxy_pass http://academico_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By $upstream_addr always;  # Cabecera temporal para demostrar el balanceo en clase
    }
}