version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: academico_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: academico_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - academico-net

  app1:
    image: ${DOCKERHUB_USERNAME}/academico-app:latest
    container_name: academico_app_1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/academico_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8080"
    networks:
      - academico-net

  app2:
    image: ${DOCKERHUB_USERNAME}/academico-app:latest
    container_name: academico_app_2
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/academico_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JAVA_TOOL_OPTIONS=-Xmx256m
    expose:
      - "8080"
    networks:
      - academico-net

  nginx:
    image: nginx:1.27-alpine
    container_name: academico_nginx
    restart: unless-stopped
    depends_on:
      - app1
      - app2
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - academico-net

volumes:
  pgdata:

networks:
  academico-net:
    driver: bridge